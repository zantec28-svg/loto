h1{flex:1;margin:0;text-align:center;font-size:clamp(1.4rem,4.5vw,3.2rem);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 8px #000}
button,label.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:#fff;color:#222}
.tools{display:flex;gap:8px;flex-wrap:wrap}
main{flex:1;min-height:0;display:flex;gap:16px;padding:16px 16px 0}
#left{flex:5;min-width:0;display:flex;flex-direction:column;gap:10px}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
#box{height:100%;max-width:100%;aspect-ratio:1;background:#fff;color:#111;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2cqmin;container-type:size}
#num{font-size:52cqmin;font-weight:800;line-height:1}
#phase{min-height:12cqmin;font-size:9cqmin;font-weight:800;color:#e0457b;text-transform:uppercase;letter-spacing:.05em;text-align:center}
#phases{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#phases button{font-weight:700;font-size:1.1rem;padding:10px 18px}
#phases button.on{background:#e0457b;color:#fff}
#grid{flex:none;width:min(100cqw,100cqh*10/9);min-width:0;display:grid;grid-template-columns:repeat(10,1fr);gap:.6cqw;align-content:center;background:rgba(0,0,0,.4);padding:1.2cqw;border-radius:14px;container-type:inline-size}
#grid button{padding:0;aspect-ratio:1;font-weight:800;font-size:4.2cqw;border-radius:6px;background:#fff}
#grid button.done{background:#e0457b;color:#fff}
#right{flex:4;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
#lot{flex:none;display:flex;align-items:center;gap:16px;margin:16px;background:#e0457b;color:#fff;border-radius:14px;padding:12px 20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#lotLabel{flex:none;font-size:1rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
#lotName{flex:1;min-width:0;font-size:clamp(1.6rem,3.4vw,3.4rem);font-weight:800;line-height:1.15;outline:none;overflow-wrap:anywhere}
#lotName:empty:before{content:attr(data-ph);opacity:.65;font-weight:600;font-size:.6em}
#lotBar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
#lotBar button{padding:6px 12px;font-weight:700}
#lotPos{min-width:90px;font-weight:700}
button:disabled{opacity:.4;cursor:default}
dialog{border:0;border-radius:14px;padding:18px;width:min(520px,92vw);color:#222}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 6px}
dialog p{margin:0 0 10px;font-size:.9rem}
#lotText{width:100%;font:inherit;padding:8px;border:1px solid #aaa;border-radius:8px;resize:vertical}
.dlgbar{display:flex;gap:8px;align-items:center;margin-top:12px}
dialog .btn,dialog button{background:#e8eef5}
dialog button.ok{background:#e0457b;color:#fff}
@media(max-width:800px){main{flex-direction:column;overflow:auto}#left{flex:none;height:70vw;min-height:300px}#right{flex:none;container-type:inline-size}#grid{width:100%}#lot{flex-direction:column;gap:8px;margin:12px}}

</head>
<body>
<header>
<h1 id="title" contenteditable="true" spellcheck="false">Loto APE Les 4 petits perchés</h1>
<div class="tools">
<button id="reset">Réinitialiser</button>
</div>
</header>
<main>
<div id="left">
<div id="phases"><button data-p="1 ligne">1 ligne</button><button data-p="2 lignes">2 lignes</button><button data-p="Carton plein">Carton plein</button></div>
<div id="stage"><div id="box"><div id="phase"></div><div id="num">?</div></div></div>
</div>
<div id="right">
<div id="grid"></div>
</div>
</main>
<footer id="lot"><div id="lotLabel">Lot en cours</div><div id="lotName" contenteditable="true" spellcheck="false" data-ph="Cliquer ici pour saisir le lot"></div>
<div id="lotBar"><button id="lotPrev" title="Lot précédent">‹</button><span id="lotPos"></span><button id="lotNext" title="Lot suivant">›</button><button id="lotImport">Importer la liste</button></div></footer>
<dialog id="dlg"><h2>Liste des lots</h2><p>Un lot par ligne : colle la liste ci-dessous ou charge un fichier .txt / .csv.</p><textarea id="lotText" rows="10" placeholder="Panier garni&#10;Bon d’achat 50 €&#10;..."></textarea><div class="dlgbar"><label class="btn">Charger un fichier<input id="lotFile" type="file" accept=".txt,.csv,text/plain,text/csv" hidden></label><span style="flex:1"></span><button id="lotCancel">Annuler</button><button id="lotOk" class="ok">Importer</button></div></dialog>
<script>
/*
 * Loto APE — tirage du loto (numéros 1 à 90), phases de jeu et liste des lots.
 * Tout l'état est conservé dans le localStorage du navigateur.
 */
'use strict';

(() => {
  const MAX_NUMBER = 90;

  // Clés localStorage (inchangées pour conserver les données existantes)
  const KEYS = {
    done: 'loto-done',
    title: 'loto-title',
    lots: 'loto-lots',
    lotIndex: 'loto-li',
    singleLot: 'loto-lot',
  };

  // ---------- Stockage ----------

  const storage = {
    get(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); } catch { /* stockage indisponible */ }
    },
    getJSON(key, fallback) {
      try {
        const raw = this.get(key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch {
        return fallback;
      }
    },
    setJSON(key, value) {
      this.set(key, JSON.stringify(value));
    },
  };

  // ---------- Éléments du DOM ----------

  const $ = (id) => document.getElementById(id);
  const el = {
    title: $('title'),
    reset: $('reset'),
    phaseButtons: [...document.querySelectorAll('#phases button')],
    phase: $('phase'),
    num: $('num'),
    grid: $('grid'),
    lotName: $('lotName'),
    lotPos: $('lotPos'),
    lotPrev: $('lotPrev'),
    lotNext: $('lotNext'),
    lotImport: $('lotImport'),
    dialog: $('dlg'),
    lotText: $('lotText'),
    lotFile: $('lotFile'),
    lotCancel: $('lotCancel'),
    lotOk: $('lotOk'),
  };

  // ---------- État ----------

  const state = {
    drawn: [],          // numéros tirés, dans l'ordre
    lots: [],           // liste des lots importée
    lotIndex: 0,        // lot affiché
  };

  const numberButtons = new Map(); // numéro -> bouton de la grille

  // ---------- Utilitaires ----------

  /** Rend un élément contenteditable « mono-ligne » : Entrée valide la saisie. */
  function singleLine(element) {
    element.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        element.blur();
      }
    });
  }

  // ---------- Tirage ----------

  function saveDrawn() {
    storage.setJSON(KEYS.done, state.drawn);
  }

  function drawNumber(n) {
    el.num.textContent = n;
    if (state.drawn.includes(n)) return;
    state.drawn.push(n);
    numberButtons.get(n).classList.add('done');
    saveDrawn();
  }

  function resetDraw() {
    if (!confirm('Remettre le tirage à zéro ?')) return;
    state.drawn = [];
    numberButtons.forEach((b) => b.classList.remove('done'));
    el.num.textContent = '?';
    saveDrawn();
  }

  function buildGrid() {
    const fragment = document.createDocumentFragment();
    for (let n = 1; n <= MAX_NUMBER; n++) {
      const button = document.createElement('button');
      button.type = 'button';
      button.id = 'b' + n;
      button.textContent = n;
      button.addEventListener('click', () => drawNumber(n));
      numberButtons.set(n, button);
      fragment.append(button);
    }
    el.grid.append(fragment);
  }

  // ---------- Phases (1 ligne, 2 lignes, carton plein) ----------

  function togglePhase(button) {
    const wasActive = button.classList.contains('on');
    el.phaseButtons.forEach((b) => b.classList.remove('on'));
    el.phase.textContent = '';
    if (!wasActive) {
      button.classList.add('on');
      el.phase.textContent = button.dataset.p;
    }
  }

  // ---------- Lots ----------

  function saveLots() {
    storage.setJSON(KEYS.lots, state.lots);
    storage.set(KEYS.lotIndex, String(state.lotIndex));
  }

  function renderLot() {
    const { lots, lotIndex } = state;
    const hasLots = lots.length > 0;
    el.lotName.textContent = hasLots ? lots[lotIndex] : (storage.get(KEYS.singleLot) || '');
    el.lotPos.textContent = hasLots ? `Lot ${lotIndex + 1} / ${lots.length}` : '';
    el.lotPrev.disabled = !hasLots || lotIndex === 0;
    el.lotNext.disabled = !hasLots || lotIndex === lots.length - 1;
  }

  function moveLot(delta) {
    if (!state.lots.length) return;
    state.lotIndex = Math.min(state.lots.length - 1, Math.max(0, state.lotIndex + delta));
    saveLots();
    renderLot();
  }

  function editLotName() {
    const value = el.lotName.textContent;
    if (state.lots.length) {
      state.lots[state.lotIndex] = value;
      saveLots();
    } else {
      storage.set(KEYS.singleLot, value);
    }
  }

  /** Une ligne = un lot ; ignore les lignes vides et les guillemets CSV. */
  function parseLots(text) {
    return text
      .split(/\r?\n/)
      .map((line) => line.trim().replace(/^"(.*)"$/, '$1'))
      .filter(Boolean);
  }

  function openImportDialog() {
    el.lotText.value = state.lots.join('\n');
    el.dialog.showModal();
  }

  function loadLotFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      el.lotText.value = String(reader.result).replace(/^﻿/, ''); // retire le BOM
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function confirmImport() {
    state.lots = parseLots(el.lotText.value);
    state.lotIndex = 0;
    saveLots();
    renderLot();
    el.dialog.close();
  }

  // ---------- Restauration de l'état sauvegardé ----------

  function restore() {
    const title = storage.get(KEYS.title);
    if (title) el.title.textContent = title;

    const lots = storage.getJSON(KEYS.lots, []);
    state.lots = Array.isArray(lots) ? lots : [];
    const index = parseInt(storage.get(KEYS.lotIndex) || '0', 10) || 0;
    state.lotIndex = index >= 0 && index < state.lots.length ? index : 0;
    renderLot();

    const drawn = storage.getJSON(KEYS.done, []);
    (Array.isArray(drawn) ? drawn : []).forEach((n) => {
      if (!numberButtons.has(n) || state.drawn.includes(n)) return;
      state.drawn.push(n);
      numberButtons.get(n).classList.add('done');
    });
  }

  // ---------- Initialisation ----------

  function init() {
    buildGrid();

    el.phaseButtons.forEach((b) => b.addEventListener('click', () => togglePhase(b)));
    el.reset.addEventListener('click', resetDraw);

    el.title.addEventListener('input', () => storage.set(KEYS.title, el.title.textContent));
    singleLine(el.title);

    el.lotPrev.addEventListener('click', () => moveLot(-1));
    el.lotNext.addEventListener('click', () => moveLot(1));
    el.lotName.addEventListener('input', editLotName);
    singleLine(el.lotName);

    el.lotImport.addEventListener('click', openImportDialog);
    el.lotFile.addEventListener('change', loadLotFile);
    el.lotCancel.addEventListener('click', () => el.dialog.close());
    el.lotOk.addEventListener('click', confirmImport);

    restore();
  }

  init();
})();
</script>
</body>
</html>
