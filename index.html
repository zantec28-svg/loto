<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loto APE</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1 id="title" contenteditable="true" spellcheck="false">Loto APE Les 4 petits perchés</h1>
<div class="tools">
<button id="reset">Réinitialiser</button>
</div>
</header>
<main>
<div id="left">
<div id="phases"><button data-p="1 ligne">1 ligne</button><button data-p="2 lignes">2 lignes</button><button data-p="Carton plein">Carton plein</button></div>
<div id="stage"><div id="box"><div id="phase"></div><div id="num">?</div></div></div>
<div id="hist"></div>
</div>
<div id="right">
<div id="lot"><div id="lotLabel">Lot en cours</div><div id="lotName" contenteditable="true" spellcheck="false" data-ph="Cliquer ici pour saisir le lot"></div>
<div id="lotBar"><button id="lotPrev" title="Lot précédent">‹</button><span id="lotPos"></span><button id="lotNext" title="Lot suivant">›</button><button id="lotImport">Importer la liste</button></div></div>
<div id="grid"></div>
</div>
</main>
<dialog id="dlg"><h2>Liste des lots</h2><p>Un lot par ligne : colle la liste ci-dessous ou charge un fichier .txt / .csv.</p><textarea id="lotText" rows="10" placeholder="Panier garni&#10;Bon d’achat 50 €&#10;..."></textarea><div class="dlgbar"><label class="btn">Charger un fichier<input id="lotFile" type="file" accept=".txt,.csv,text/plain,text/csv" hidden></label><span style="flex:1"></span><button id="lotCancel">Annuler</button><button id="lotOk" class="ok">Importer</button></div></dialog>
<script src="app.js"></script>
</body>
</html>
